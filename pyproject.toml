[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-tui"
version = "0.1.0"
description = "Agentic TUI with RAG for codebase editing"
readme = "README.md"
requires-python = ">=3.10"
# No SPDX license identifier set
dependencies = [
    "textual>=0.50.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "openai>=1.30.0",
    "numpy>=1.26.0",
    "tiktoken>=0.7.0",
    "GitPython>=3.1.0",
    "bm25s>=0.1.0",
    "platformdirs>=4.0.0",
    "scikit-learn>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
agentic-tui = "tui.app:main"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
